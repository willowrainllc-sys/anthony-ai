<title>SECURE SETTLEMENT | Obsidian Global</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Space+Grotesk:wght@300;500;700&amp;display=swap" rel="stylesheet"/>
<style>
        :root { --bg: #010103; --accent: #3b82f6; --gold: #fbbf24; --border: rgba(255, 255, 255, 0.05); }
        body { background: var(--bg); color: #fff; font-family: 'Space Grotesk', sans-serif; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        .gate-card { background: rgba(10, 10, 20, 0.9); border: 1px solid var(--border); border-radius: 40px; padding: 60px; max-width: 500px; width: 90%; box-shadow: 0 20px 80px rgba(0,0,0,0.5); }
        h2 { font-family: 'Orbitron'; font-size: 1.8em; letter-spacing: 3px; color: var(--gold); margin-bottom: 30px; }
        .price { font-size: 4em; font-weight: 900; margin-bottom: 40px; }
        .btn-confirm { background: #fff; color: #000; padding: 20px 50px; border-radius: 100px; font-weight: 900; text-decoration: none; display: inline-block; font-size: 1.1em; transition: 0.3s; cursor: pointer; border: none; }
        .btn-confirm:hover { background: #10b981; color: #fff; transform: scale(1.05); }
        .secure-tag { margin-top: 40px; font-size: 0.6em; color: #444; letter-spacing: 5px; text-transform: uppercase; font-weight: 800; }
    </style>
<link href="/assets/hyper_frame.css" rel="stylesheet"/><script src="/assets/hyper_frame.js"></script></head>
<body>
<div class="gate-card">
<h2>SECURE SETTLEMENT</h2>
<div class="price" id="payoutAmount">$0.00</div>
<p style="color: #666; line-height: 1.6; margin-bottom: 40px;">This transaction is routed through the Obsidian Secure Core. No 3rd party logs. 100% Private.</p>
<button class="btn-confirm" onclick="window.location.href='success.html'">Confirm Settlement</button>
<div class="secure-tag">ENCRYPTED VIA KYBER-1024</div>
</div>
<script>
        const urlParams = new URLSearchParams(window.location.search);
        const amount = urlParams.get('amount') || '$0.00';
        document.getElementById('payoutAmount').innerText = amount;
    </script>
