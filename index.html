<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANTHONY AI — Sovereign Access Gate</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #111111;
            --accent-emerald: #50C878;
            --accent-gold: #D4AF37;
            --text-color: #FFFFFF;
            --text-muted: #888888;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .login-box {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 60px 40px;
            border-radius: 24px;
            box-shadow: 0 32px 64px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 440px;
            backdrop-filter: blur(20px);
        }

        .logo-ring {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--accent-emerald), var(--accent-gold));
            margin: 0 auto 32px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(80, 200, 120, 0.2);
        }

        .logo-inner {
            background: #000;
            width: calc(100% - 4px);
            height: calc(100% - 4px);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #fff;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        input {
            background: #000;
            border: 1px solid var(--border);
            color: #ffffff;
            padding: 16px 20px;
            margin-bottom: 20px;
            width: 100%;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: var(--accent-emerald);
            background: #050505;
        }

        .btn-gradient {
            background: #fff;
            color: #000;
            border: none;
            padding: 16px;
            width: 100%;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 24px;
        }

        .btn-gradient:hover {
            background: var(--accent-emerald);
            color: #fff;
        }

        .footer-links {
            font-size: 0.7rem;
            color: var(--text-muted);
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: 0.2s;
        }

        .footer-links a:hover {
            color: #fff;
        }

        .error {
            color: #ff4444;
            font-size: 0.8rem;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo-ring">
            <div class="logo-inner">💎</div>
        </div>
        <div class="brand-title">ANTHONY AI</div>
        <div class="subtitle">Sovereign Access Gateway</div>

        <input type="password" id="accessKey" placeholder="Enter Credentials">
        <button class="btn-gradient" onclick="authenticate()">VERIFY AUTHORITY</button>

        <div id="errorMsg" class="error">INVALID ACCESS TOKEN</div>

        <div class="footer-links">
            <a href="willow_rain_global/wholesale_portal/terms.html">Terms</a>
            <a href="willow_rain_global/wholesale_portal/privacy.html">Privacy</a>
        </div>
    </div>

    <script>
        function authenticate() {
            const passcode = document.getElementById('accessKey').value.trim();
            if (passcode === 'Deadangone19@') {
                sessionStorage.setItem('authorized', 'true');
                window.location.href = 'willow_rain_global/wholesale_portal/obsidian_master_hub.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        document.getElementById('accessKey').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') authenticate();
        });
    </script>
    <!-- --- Built by Anthony Christopher | Est 12.19.1987 --- -->
</body>
</html>
