<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AUTHORIZED | Obsidian Global</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Space+Grotesk:wght@300;500;700&amp;display=swap" rel="stylesheet"/>
<style>
        :root { --bg: #010103; --accent: #10b981; --gold: #fbbf24; --border: rgba(255, 255, 255, 0.05); }
        body { background: var(--bg); color: #fff; font-family: 'Space Grotesk', sans-serif; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        .success-box { background: rgba(10, 10, 20, 0.9); border: 1px solid var(--border); border-radius: 40px; padding: 60px; max-width: 500px; width: 90%; box-shadow: 0 20px 80px rgba(16, 185, 129, 0.1); }
        .icon { font-size: 4em; margin-bottom: 30px; }
        h2 { font-family: 'Orbitron'; font-size: 1.8em; letter-spacing: 3px; color: var(--accent); margin-bottom: 20px; }
        p { color: #666; line-height: 1.6; margin-bottom: 40px; }

        .progress-stepper { display: flex; justify-content: space-between; margin-bottom: 40px; position: relative; }
        .step { width: 30%; height: 4px; background: #111; border-radius: 10px; position: relative; }
        .step.active { background: var(--accent); }
        .step-label { position: absolute; top: 15px; width: 100%; font-size: 0.6rem; color: #444; font-weight: 800; letter-spacing: 1px; }

        .btn-return { background: #fff; color: #000; padding: 15px 40px; border-radius: 100px; font-weight: 900; text-decoration: none; transition: 0.3s; }
        .btn-return:hover { background: var(--accent); color: #fff; transform: scale(1.05); }
    </style>
<link href="/assets/hyper_frame.css" rel="stylesheet"/><script src="/assets/hyper_frame.js"></script></head>
<body>
<div class="success-box">
<div class="icon">🔱</div>
<h2>SECURE_AUTHORIZED</h2>
<p>Your transaction has been verified. The AI Team has been dispatched for physical asset provisioning.</p>
<div class="progress-stepper">
<div class="step active"><div class="step-label">PAYMENT</div></div>
<div class="step active"><div class="step-label">VERIFYING</div></div>
<div class="step" id="finalStep"><div class="step-label" id="finalLabel">PROVISIONING</div></div>
</div>
<a class="btn-return" href="obsidian_master_hub.html">RETURN TO HUB</a>
<p style="margin-top: 40px; font-size: 0.6rem; color: #333; text-transform: uppercase; letter-spacing: 3px;">
            No Returns | Re-Strikes Only | Maestas Legacy
        </p>
</div>
<script>
        setTimeout(() => {
            document.getElementById('finalStep').classList.add('active');
            document.getElementById('finalLabel').innerText = "AUTHORIZED";
            document.getElementById('finalLabel').style.color = "#10b981";
        }, 5000);
    </script>
<!-- --- Built by Anthony Christopher | Est 12.19.1987 --- -->
</body>
</html>
