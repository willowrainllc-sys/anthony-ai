<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OBSIDIAN AUTH | Global Ingress | Anthony Christopher</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
        :root { --bg: #050505; --accent: #50C878; --border: rgba(255, 255, 255, 0.08); }
        body { background-color: var(--bg); color: #fff; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #0a0a0a; border: 1px solid var(--border); padding: 60px; border-radius: 24px; text-align: center; max-width: 450px; width: 90%; box-shadow: 0 40px 100px rgba(0,0,0,0.8); }
        .logo { font-family: 'Orbitron'; font-weight: 900; letter-spacing: 8px; color: #fff; margin-bottom: 40px; }
        .brand-dot { width: 12px; height: 12px; background: var(--accent); display: inline-block; margin-right: 15px; border-radius: 2px; box-shadow: 0 0 15px var(--accent); }
        input { width: 100%; background: #000; border: 1px solid var(--border); padding: 18px 25px; margin-bottom: 20px; color: #fff; border-radius: 12px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 30px rgba(80, 200, 120, 0.1); }
        .btn-auth { width: 100%; background: #fff; color: #000; padding: 18px; border-radius: 100px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; border: none; cursor: pointer; transition: 0.3s; }
        .btn-auth:hover { background: var(--accent); color: #fff; transform: scale(1.02); }
        .footer-sig { margin-top: 40px; font-size: 0.6rem; color: #222; font-family: monospace; letter-spacing: 2px; }
    </style>
<link href="/assets/hyper_frame.css" rel="stylesheet"/><script src="/assets/hyper_frame.js"></script></head>
<body>
<div class="login-card">
<div class="logo"><div class="brand-dot"></div>OBSIDIAN</div>
<h2 class="text-xl font-bold mb-2 uppercase tracking-widest">Global Access</h2>
<p class="text-gray-500 text-sm mb-10">Verification required for World Network Ingress.</p>
<form id="authForm">
<input id="directorId" placeholder="DIRECTOR_ID" required="" type="text"/>
<input id="rootKey" placeholder="MAESTAS_ROOT_KEY" required="" type="password"/>
<button class="btn-auth" type="submit">Authorize Handshake</button>
</form>
<div class="footer-sig">
            # --- Built by Anthony Christopher | Est 12.19.1987 ---
        </div>
</div>
<script>
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const key = document.getElementById('rootKey').value;
            // Physical Handshake with Global Web Server
            document.cookie = "obsidian_auth_key=" + key + "; path=/; max-age=86400";
            window.location.reload();
        });
    </script>
</body>
</html>
