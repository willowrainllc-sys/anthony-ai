<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DISPUTE PORTAL | Obsidian Secure Core | Anthony Christopher</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Space+Grotesk:wght@300;500;700&amp;display=swap" rel="stylesheet"/>
<style>
        :root {
            --bg: #050505;
            --surface: #111111;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --border: rgba(255, 255, 255, 0.08);
            --text-muted: #888;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .portal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 60px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 80px rgba(0,0,0,0.5);
        }

        h2 { font-family: 'Orbitron'; font-size: 2rem; color: #fff; margin-bottom: 24px; letter-spacing: 2px; }
        p { color: var(--text-muted); line-height: 1.6; margin-bottom: 40px; }

        .input-group { text-align: left; margin-bottom: 24px; }
        .input-group label { display: block; font-size: 0.75rem; color: #444; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; font-weight: 800; }

        input, textarea {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 12px;
            color: #fff;
            outline: none;
            box-sizing: border-box;
        }

        input:focus, textarea:focus { border-color: var(--accent-blue); }

        .btn-submit {
            width: 100%;
            background: #fff;
            color: #000;
            padding: 20px;
            border-radius: 100px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover { background: var(--accent-red); color: #fff; transform: scale(1.02); }

        .status-tag { margin-top: 40px; font-size: 0.6rem; color: #333; letter-spacing: 5px; text-transform: uppercase; font-weight: 800; }
    </style>
<link href="/assets/hyper_frame.css" rel="stylesheet"/><script src="/assets/hyper_frame.js"></script></head>
<body>
<div class="portal-card">
<h2>REPORT ISSUE</h2>
<p>If your digital asset strike failed to verify, submit a ticket for AI Audit. No cash returns—RE-STRIKES only.</p>
<form onsubmit="event.preventDefault(); alert('🔱 Dispute Dispatched to AI Team. Status: REVIEWING.'); window.location.href='index.html';">
<div class="input-group">
<label>TRANSACTION ID / INVOICE #</label>
<input placeholder="INV-XXXX" required="" type="text"/>
</div>
<div class="input-group">
<label>REASON FOR DISPUTE</label>
<textarea placeholder="Describe the node failure..." rows="4"></textarea>
</div>
<button class="btn-submit" type="submit">SUBMIT FOR AUDIT</button>
</form>
<div class="status-tag">SECURED BY OBSIDIAN DEFENSE</div>
</div>
<!-- --- Built by Anthony Christopher | Est 12.19.1987 --- -->
</body>
</html>
