<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&amp;family=Inter:wght@400;700;900&amp;display=swap" rel="stylesheet"/>
<style>
        :root {
            --bg: #000000;
            --accent: #ff9900;
            --glass: rgba(20, 20, 20, 0.9);
            --border: #333;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle at center, #1b1b1b 0%, #000 80%);
        }

        .login-box {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 50px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 153, 0, 0.1);
        }

        .logo {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 2.5em;
            background: var(--accent);
            color: #000;
            padding: 5px 15px;
            border-radius: 5px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 30px;
        }

        h2 { font-weight: 900; letter-spacing: -1px; margin-bottom: 10px; }
        p { color: #666; font-size: 0.9em; margin-bottom: 30px; }

        input {
            width: 100%;
            background: #111;
            border: 1px solid var(--border);
            padding: 15px;
            margin-bottom: 15px;
            color: #fff;
            border-radius: 5px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus { border-color: var(--accent); }

        .btn-login {
            width: 100%;
            background: var(--accent);
            color: #000;
            padding: 15px;
            border-radius: 5px;
            font-weight: 900;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-login:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(255, 153, 0, 0.3); }

        .footer-links { margin-top: 25px; font-size: 0.75em; color: #444; }
        .footer-links a { color: #666; text-decoration: none; }
    </style>
