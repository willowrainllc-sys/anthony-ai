<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANTHONY AI — Secure Access Gate</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Vercel Analytics & Speed Insights -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #121620;
            --accent-green: #00ff88;
            --accent-blue: #0055ff;
            --accent-purple: #9900ff;
            --accent-pink: #ff0055;
            --text-color: #e0e6ed;
            --text-muted: #8a99a8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .login-box {
            background: #12141c;
            border: 1px solid rgba(0, 255, 136, 0.2);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 255, 136, 0.1);
            text-align: center;
            width: 100%;
            max-width: 420px;
        }

        .logo-ring {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
            padding: 3px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-inner {
            background: #1c1c1e;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 24px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            background: #161618;
            border: 1px solid #2c2c2e;
            color: #ffffff;
            padding: 14px 16px;
            margin-bottom: 16px;
            width: 100%;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-green);
        }

        .btn-gradient {
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
            color: #ffffff;
            border: none;
            padding: 14px;
            width: 100%;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-bottom: 12px;
        }

        .btn-gradient:hover {
            opacity: 0.9;
        }

        .btn-social {
            background: #161618;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            width: 100%;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-social:hover {
            border-color: var(--accent-green);
        }

        .skip-link {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
            margin-top: 16px;
            display: inline-block;
        }

        .skip-link:hover {
            color: var(--accent-green);
        }

        .error {
            color: #ff3355;
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo-ring">
            <div class="logo-inner">🐜</div>
        </div>
        <div class="brand-title">ANTHONY AI</div>
        <div class="subtitle">Mission Hub // Access Terminal</div>

        <input type="password" id="accessKey" placeholder="Enter Access Code (or press Authenticate)">
        <button class="btn-gradient" onclick="authenticate()">AUTHENTICATE GRID</button>

        <button class="btn-social" onclick="guestLogin()">♪ Log in with TikTok</button>
        <button class="btn-social" onclick="guestLogin()">G Continue with Google</button>
        <button class="btn-social" onclick="guestLogin()">f Continue with Facebook</button>

        <a class="skip-link" onclick="guestLogin()">Skip for now &rarr;</a>
        <div id="errorMsg" class="error">Access Denied: Invalid Access Code</div>
    </div>

    <script>
        function authenticate() {
            const passcode = document.getElementById('accessKey').value.trim();
            if (passcode === 'anthony2026' || passcode === 'yourpassword' || passcode === '') {
                sessionStorage.setItem('authorized', 'true');
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function guestLogin() {
            sessionStorage.setItem('authorized', 'true');
            window.location.href = 'dashboard.html';
        }

        document.getElementById('accessKey').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') authenticate();
        });
    </script>
</body>
</html>
