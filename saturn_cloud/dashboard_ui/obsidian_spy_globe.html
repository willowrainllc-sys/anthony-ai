<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL EYE | Industrial Spy Globe | Obsidian Global</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.108/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.108/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --accent: #ef4444; --gold: #fbbf24; --matrix: #00ff41; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; overflow: hidden; font-family: 'Space Mono', monospace; }
        #cesiumContainer { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; border: 1px solid rgba(0, 255, 65, 0.1); box-sizing: border-box; }
        .header { position: absolute; top: 40px; left: 40px; pointer-events: auto; }
        .logo { font-family: 'Orbitron'; font-weight: 900; letter-spacing: 10px; color: var(--matrix); font-size: 2em; text-shadow: 0 0 15px var(--matrix); }

        .cam-box {
            width: 320px;
            background: rgba(0,0,0,0.95);
            border: 1px solid var(--matrix);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.2);
        }
        .cam-box video { width: 100%; height: 180px; background: #000; border-radius: 5px; }
        .meta { font-size: 10px; color: #444; margin-top: 10px; display: flex; justify-content: space-between; }

        .vitals { position: absolute; bottom: 40px; right: 40px; text-align: right; pointer-events: auto; background: rgba(0,0,0,0.6); padding: 25px; border-radius: 20px; border: 1px solid var(--border); }
        .vitals .value { font-size: 2em; font-weight: 900; color: var(--gold); font-family: 'Orbitron'; }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="header">
            <div class="logo">GLOBAL EYE</div>
            <p style="color: #444; letter-spacing: 5px; font-size: 0.7em;">SPATIAL_INGRESS_v3.0</p>
        </div>
        <div class="vitals">
            <div style="font-size: 9px; color: #666; letter-spacing: 2px;">MESH_DIRECTOR_SYNC</div>
            <div class="value">ST. CHARLES HUB</div>
            <div style="margin-top: 10px; color: var(--matrix); font-size: 12px; font-weight: 800;">[ 14,282 SIGNALS LOCKED ]</div>
        </div>
    </div>

    <div id="cesiumContainer"></div>

    <script>
        // --- Built by Anthony Christopher | Est 12.19.1987 ---
        // Using public Sentinel imagery
        const viewer = new Cesium.Viewer('cesiumContainer', {
            baseLayerPicker: false, geocoder: false, homeButton: false, infoBox: true,
            selectionIndicator: false, navigationHelpButton: false, sceneModePicker: false,
            timeline: false, animation: false, fullscreenButton: false
        });

        viewer.scene.skyAtmosphere.show = false;
        viewer.scene.backgroundColor = Cesium.Color.BLACK;

        // 🔱 1. THE DIRECTOR (THE ANT) - ST. CHARLES, MO
        const antEntity = viewer.entities.add({
            name: '🔱 SUPREME_COMMAND: ANTHONY_MAESTAS',
            position: Cesium.Cartesian3.fromDegrees(-90.484, 38.783),
            point: { pixelSize: 15, color: Cesium.Color.fromCssColorString('#fbbf24'), outlineColor: Cesium.Color.BLACK, outlineWidth: 3 },
            label: { text: '🔱 ANT', font: '10px Orbitron', style: Cesium.LabelStyle.FILL_AND_OUTLINE, outlineWidth: 2, verticalOrigin: Cesium.VerticalOrigin.BOTTOM, pixelOffset: new Cesium.Cartesian2(0, -25) }
        });

        // 🔱 2. LIVE SPY NODES (Real 2026 M3U8 Feeds)
        const cameraNodes = [
            { city: "NYC_TIMES_SQUARE", lat: 40.7580, lon: -73.9855, url: "http://video2.earthcam.com/fecnetwork/hdtimes11.flv/hasbahca.m3u8" },
            { city: "TOKYO_SHIBUYA", lat: 35.6595, lon: 139.7004, url: "http://video2.earthcam.com/fecnetwork/tokyo1.flv/medien.m3u8" },
            { city: "DUBLIN_INGRESS", lat: 53.3425, lon: -6.2658, url: "http://video2.earthcam.com/fecnetwork/4054.flv/medien.m3u8" },
            { city: "PUEBLO_BELMONT", lat: 38.2731, lon: -104.6044, url: "local_vortex_1" }
        ];

        cameraNodes.forEach(cam => {
            const description = cam.url.startsWith('http') ? `
                <div class="cam-box">
                    <div style="font-family:'Orbitron'; color:var(--matrix); font-size:12px; margin-bottom:10px;">${cam.city}_INGRESS</div>
                    <video id="video_${cam.city}" autoplay muted controls></video>
                    <div class="meta"><span>LAT: ${cam.lat}</span><span>LON: ${cam.lon}</span></div>
                    <script>
                        var video = document.getElementById('video_${cam.city}');
                        if (Hls.isSupported()) {
                            var hls = new Hls();
                            hls.loadSource('${cam.url}');
                            hls.attachMedia(video);
                        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                            video.src = '${cam.url}';
                        }
                    <\/script>
                </div>` : `
                <div class="cam-box">
                    <div style="font-family:'Orbitron'; color:var(--gold); font-size:12px; margin-bottom:10px;">${cam.city}_RECON</div>
                    <div style="height:180px; background:#111; display:flex; align-items:center; justify-content:center; color:#444; font-size:10px;">[ RELAYING GHOST SIGNAL ]</div>
                    <div style="font-size:9px; color:#ef4444; margin-top:10px; font-weight:800;">ENCRYPTED VIA OBSIDIAN CORE</div>
                </div>`;

            viewer.entities.add({
                name: cam.city,
                position: Cesium.Cartesian3.fromDegrees(cam.lon, cam.lat),
                point: { pixelSize: 8, color: Cesium.Color.RED, outlineColor: Cesium.Color.RED.withAlpha(0.2), outlineWidth: 15 },
                description: description
            });
        });

        viewer.zoomTo(antEntity);
    </script>
</body>
</html>
