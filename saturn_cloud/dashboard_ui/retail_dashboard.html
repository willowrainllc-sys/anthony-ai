<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-OBSIDIAN_GLOBAL_ADSENSE" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Empire | Obsidian Global</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --accent: #10b981; --border: rgba(255, 255, 255, 0.1); }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 40px; }
        .grid { display: grid; grid-template-cols: 1fr 1fr; gap: 30px; }
        .monitor-card { background: #0f172a; border: 1px solid var(--border); border-radius: 24px; padding: 20px; overflow: hidden; }
        .live-label { color: #ef4444; font-weight: 800; font-size: 0.8em; display: flex; align-items: center; gap: 5px; }
        .live-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .screen-view { width: 100%; height: 300px; background: #000; border-radius: 12px; margin-top: 15px; display: flex; align-items: center; justify-content: center; color: #444; }
        .stats { display: flex; justify-content: space-between; margin-top: 20px; font-size: 0.9em; }
    </style>
</head>
<body>
    <div style="margin-bottom: 50px;">
        <h1 style="font-family: 'Orbitron'; letter-spacing: 5px;">RETAIL EMPIRE COMMAND</h1>
        <p style="color: #64748b;">Live "Ghost Vision" Feed from the Marketplace Bots.</p>
    </div>

    <div class="grid">
        <!-- 🪐 AMAZON SELLER GHOST -->
        <div class="monitor-card">
            <div class="live-label"><div class="live-dot"></div> LIVE FEED: AMAZON_SELLER</div>
            <div class="screen-view">
                <img src="file:///D:/AnthonyAi_Swarm/Secure_Assets/Ghost_Vision/amazon_bot_live.png" style="width: 100%; height: 100%; object-fit: contain;" onerror="this.style.display='none'">
                <span>[ ATTACHING TO SELLER CENTRAL... ]</span>
            </div>
            <div class="stats">
                <div><span>Status:</span> <span style="color: var(--accent);">Listing Books</span></div>
                <div><span>Queue:</span> 1,248 Units</div>
            </div>
        </div>

        <!-- 🪐 PRINTFUL DESIGN GHOST -->
        <div class="monitor-card">
            <div class="live-label"><div class="live-dot"></div> LIVE FEED: PRINTFUL_LAB</div>
            <div class="screen-view">
                 <img src="file:///D:/AnthonyAi_Swarm/Secure_Assets/Ghost_Vision/printful_bot_live.png" style="width: 100%; height: 100%; object-fit: contain;" onerror="this.style.display='none'">
                <span>[ GENERATING MOCKUPS... ]</span>
            </div>
            <div class="stats">
                <div><span>Status:</span> <span style="color: var(--accent);">Active Design</span></div>
                <div><span>Target:</span> Shopify Store</div>
            </div>
        </div>
    </div>

    <script>
        // Auto-refresh the images every 5 seconds to show the 'Live' action
        setInterval(() => {
            const images = document.querySelectorAll('img');
            images.forEach(img => {
                const src = img.src.split('?')[0];
                img.src = src + '?t=' + new Date().getTime();
            });
        }, 5000);
    </script>
</body>
</html>
