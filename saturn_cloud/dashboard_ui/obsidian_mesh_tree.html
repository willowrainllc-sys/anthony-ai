<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-OBSIDIAN_GLOBAL_ADSENSE" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MESH TREE | Obsidian Global Autopilot</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --base: #8b5cf6;
            --node: #10b981;
            --line: rgba(16, 185, 129, 0.2);
            --text: #ffffff;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Space Mono', monospace;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #tree-container {
            width: 100%;
            height: 100%;
            position: relative;
            background-image: radial-gradient(circle, #111 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .node {
            position: absolute;
            width: 180px;
            padding: 15px;
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid var(--line);
            border-radius: 12px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: 0.3s;
        }

        .node:hover {
            border-color: var(--node);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
            transform: scale(1.05);
        }

        .node.base {
            width: 220px;
            border-color: var(--base);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
        }

        .node-title {
            font-family: 'Orbitron';
            font-size: 0.8em;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .node-status {
            font-size: 0.6em;
            color: var(--node);
            text-transform: uppercase;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--node);
            border-radius: 50%;
            margin-right: 5px;
            box-shadow: 0 0 8px var(--node);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .connection-line {
            stroke: var(--line);
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 5;
            animation: dash 10s linear infinite;
        }

        @keyframes dash {
            to { stroke-dashoffset: -100; }
        }

        .overlay-text {
            position: fixed;
            top: 30px;
            left: 40px;
            font-family: 'Orbitron';
            letter-spacing: 5px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="overlay-text">OBSIDIAN_MESH_TREE_v1.0</div>

    <div id="tree-container">
        <svg id="svg-connections"></svg>

        <!-- 🔱 ANTHONY AI BASE (ROOT) -->
        <div class="node base" id="node-base" style="top: 50%; left: 50%; transform: translate(-50%, -50%);">
            <div class="node-title">ANTHONY AI BASE</div>
            <div class="node-status"><span class="status-dot"></span> SOVEREIGN_CORE</div>
            <div style="font-size: 10px; color: #444; margin-top: 5px;">Pueblo Root | Missouri Matrix</div>
        </div>

        <!-- 🌪️ VORTEX -->
        <div class="node" id="node-vortex" style="top: 20%; left: 30%;">
            <div class="node-title">VORTEX</div>
            <div class="node-status"><span class="status-dot"></span> 48.2 TB/S</div>
        </div>

        <!-- 👤 GHOST VAULT -->
        <div class="node" id="node-ghost" style="top: 20%; left: 70%;">
            <div class="node-title">GHOST VAULT</div>
            <div class="node-status"><span class="status-dot"></span> 10K LEADS</div>
        </div>

        <!-- 🏘️ BRICK & BITCOIN -->
        <div class="node" id="node-brick" style="top: 50%; left: 15%;">
            <div class="node-title">BRICK & BTC</div>
            <div class="node-status"><span class="status-dot"></span> BROKERING</div>
        </div>

        <!-- 🌐 SOVEREIGN NODE -->
        <div class="node" id="node-node" style="top: 50%; left: 85%;">
            <div class="node-title">SOVEREIGN NODE</div>
            <div class="node-status"><span class="status-dot"></span> REGISTRAR</div>
        </div>

        <!-- 🎬 BLACK HOLE -->
        <div class="node" id="node-hole" style="top: 80%; left: 30%;">
            <div class="node-title">BLACK HOLE</div>
            <div class="node-status"><span class="status-dot"></span> 81 FILMS</div>
        </div>

        <!-- 🐋 WHALE STRIKE -->
        <div class="node" id="node-whale" style="top: 80%; left: 70%;">
            <div class="node-title">WHALE STRIKE</div>
            <div class="node-status"><span class="status-dot"></span> SCALPING</div>
        </div>

        <!-- CLUSTER: 103 LOCAL -->
        <div class="node" id="node-local" style="top: 10%; left: 50%; transform: translateX(-50%); width: 120px;">
            <div class="node-title" style="font-size: 0.6em;">LOCAL_HIVE</div>
            <div class="node-status" style="font-size: 0.5em;">103 NODES</div>
        </div>

        <!-- CLUSTER: 5000 CLOUD -->
        <div class="node" id="node-cloud" style="top: 90%; left: 50%; transform: translateX(-50%); width: 120px;">
            <div class="node-title" style="font-size: 0.6em;">CLOUD_GHOST</div>
            <div class="node-status" style="font-size: 0.5em;">50,000 NODES</div>
        </div>

    </div>

    <script>
        function drawConnections() {
            const base = document.getElementById('node-base').getBoundingClientRect();
            const svg = document.getElementById('svg-connections');
            const nodes = ['node-vortex', 'node-ghost', 'node-brick', 'node-node', 'node-hole', 'node-whale', 'node-local', 'node-cloud'];

            svg.innerHTML = ''; // Clear

            nodes.forEach(id => {
                const target = document.getElementById(id).getBoundingClientRect();

                const x1 = base.left + base.width / 2;
                const y1 = base.top + base.height / 2;
                const x2 = target.left + target.width / 2;
                const y2 = target.top + target.height / 2;

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1);
                line.setAttribute('y1', y1);
                line.setAttribute('x2', x2);
                line.setAttribute('y2', y2);
                line.setAttribute('class', 'connection-line');
                svg.appendChild(line);
            });
        }

        window.onload = drawConnections;
        window.onresize = drawConnections;
    </script>
</body>
</html>
