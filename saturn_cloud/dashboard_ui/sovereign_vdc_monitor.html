<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-OBSIDIAN_GLOBAL_ADSENSE" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOVEREIGN VDC | Obsidian Global</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --accent: #3b82f6;
            --glass: rgba(15, 15, 25, 0.8);
            --border: rgba(255, 255, 255, 0.1);
            --blade: #111827;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            padding: 50px;
            overflow: hidden;
            display: grid;
            grid-template-rows: auto 1fr;
            height: 100vh;
        }

        /* 🔱 3D VDC Layout */
        .vdc-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 60px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        .vdc-header h1 { font-family: 'Orbitron'; font-size: 3em; margin: 0; letter-spacing: -2px; color: #fff; }

        .vdc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            overflow-y: auto;
            padding: 20px;
        }

        /* 🔱 Server Blade Component */
        .blade-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 40px;
            position: relative;
            backdrop-filter: blur(20px);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .blade-card:hover {
            transform: scale(1.05) rotateY(10deg);
            border-color: var(--accent);
            box-shadow: 0 20px 50px rgba(59, 130, 246, 0.2);
        }

        .rack-visual {
            height: 250px;
            background: #050505;
            border-radius: 20px;
            margin: 25px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .unit {
            height: 15px;
            background: #111;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 0.5em;
            color: #333;
        }

        .unit.active {
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        .status-badge {
            position: absolute;
            top: 30px;
            right: 30px;
            font-size: 0.7em;
            font-weight: 800;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            padding: 5px 15px;
            border-radius: 100px;
            letter-spacing: 2px;
        }

        /* 🔱 Data Waterfall Animation */
        .data-stream {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 5px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: dataFlow 2s infinite;
        }

        @keyframes dataFlow { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

    </style>
</head>
<body>
    <div class="data-stream"></div>

    <div class="vdc-header">
        <div>
            <p style="color: var(--accent); letter-spacing: 10px; font-weight: 700; margin-bottom: 10px;">SOVEREIGN INFRASTRUCTURE</p>
            <h1>OBSIDIAN VDC</h1>
        </div>
        <div style="text-align: right;">
            <p style="color: #444; font-size: 0.8em; letter-spacing: 2px;">INDEPENDENCE SCORE</p>
            <p style="font-size: 2.5em; font-weight: 900; color: #10b981; margin: 0;">100%</p>
        </div>
    </div>

    <div class="vdc-grid">
        <!-- 🪐 BLADE 01: MISSOURI ROOT -->
        <div class="blade-card">
            <div class="status-badge">SOVEREIGN</div>
            <h2 style="font-family: 'Orbitron'; font-size: 1.2em; letter-spacing: 3px;">BLADE-ALPHA-01</h2>
            <div class="rack-visual" id="rack1"></div>
            <div style="display: flex; justify-content: space-between; font-size: 0.8em; color: #666;">
                <span>Cores: 32</span>
                <span>RAM: 64GB</span>
                <span style="color: var(--accent);">Active: 10,000 Nodes</span>
            </div>
        </div>

        <!-- 🪐 BLADE 02: GHOST MESH -->
        <div class="blade-card">
            <div class="status-badge">REBIRTH</div>
            <h2 style="font-family: 'Orbitron'; font-size: 1.2em; letter-spacing: 3px;">BLADE-BETA-02</h2>
            <div class="rack-visual" id="rack2"></div>
            <div style="display: flex; justify-content: space-between; font-size: 0.8em; color: #666;">
                <span>Cores: 16</span>
                <span>RAM: 32GB</span>
                <span style="color: var(--accent);">Active: 5,000 Nodes</span>
            </div>
        </div>
    </div>

    <script>
        function fillRack(id, activeCount) {
            const rack = document.getElementById(id);
            for (let i = 0; i < 10; i++) {
                const unit = document.createElement('div');
                unit.className = 'unit' + (i < activeCount ? ' active' : '');
                unit.innerText = `UNIT_SVR_${i+1}`;
                rack.appendChild(unit);
            }
        }
        fillRack('rack1', 8);
        fillRack('rack2', 4);
    </script>
</body>
</html>
