<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign In | Obsidian City Account Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; color: #0f172a; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .auth-card { background: #ffffff; border: 1px solid #e2e8f0; padding: 45px; border-radius: 28px; width: 100%; max-width: 440px; box-shadow: 0 20px 50px rgba(0,0,0,0.06); }
        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 11px; color: #475569; margin-bottom: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; background: #f8fafc; border: 1px solid #cbd5e1; padding: 12px 16px; border-radius: 12px; color: #0f172a; outline: none; transition: 0.2s; font-size: 14px; }
        input:focus { border-color: #2563eb; background: #ffffff; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn-primary { width: 100%; background: #2563eb; color: #fff; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 14px; transition: 0.2s; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(37,99,235,0.25); }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-social { width: 100%; background: #ffffff; border: 1px solid #cbd5e1; color: #0f172a; padding: 12px; border-radius: 12px; font-weight: 600; font-size: 13px; transition: 0.2s; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; }
        .btn-social:hover { background: #f1f5f9; border-color: #94a3b8; }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="mb-4">
        <a href="index.html" class="text-xs font-bold text-blue-600 hover:underline">← Return to Storefront</a>
    </div>

    <div class="text-center mb-8">
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">Sign in to Obsidian</h1>
        <p class="text-xs text-slate-500 mt-1">Manage domains, hosting, and empire billing.</p>
    </div>

    <!-- Social / Multi-Provider Sign In Options -->
    <div class="space-y-3 mb-6" id="socialAuthSection">
        <button onclick="handleSocialAuth('Google')" class="btn-social">
            <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.15v3.15C3.15 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.15C.42 8.05 0 9.71 0 12s.42 3.95 1.15 5.42l4.13-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.68 1.15 6.58l4.13 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
            Continue with Google
        </button>
        <button onclick="handleSocialAuth('GitHub')" class="btn-social">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02_0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            Continue with GitHub
        </button>
        <button onclick="handleSocialAuth('Passkey')" class="btn-social">
            🔑 Continue with Passkey / Biometrics
        </button>
    </div>

    <div class="relative flex py-2 items-center mb-6" id="orDivider">
        <div class="flex-grow border-t border-slate-200"></div>
        <span class="flex-shrink mx-4 text-slate-400 text-[11px] uppercase tracking-wider font-bold">Or email</span>
        <div class="flex-grow border-t border-slate-200"></div>
    </div>

    <!-- Step 1: Email Form -->
    <form id="emailForm">
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="userEmail" aria-label="Email Address" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="btn-primary mt-2">Send Verification Code</button>
    </form>

    <!-- Step 2: OTP Verification Form (Hidden Initially) -->
    <form id="otpForm" style="display:none;">
        <div class="mb-4 text-center">
            <p class="text-xs text-emerald-600 font-bold">✓ Verification code sent to <span id="sentEmailDisplay" class="underline"></span></p>
            <p class="text-[10px] text-slate-400 mt-1">Enter the 6-digit code to securely sign in.</p>
        </div>
        <div class="input-group">
            <label>6-Digit Verification Code</label>
            <input type="text" id="otpCode" aria-label="Verification Code" placeholder="123456" maxlength="6" required>
        </div>
        <button type="submit" class="btn-primary mt-2">Verify & Sign In</button>
    </form>

    <div class="mt-8 text-center text-xs text-slate-500">
        <p>Don't have an account? <a href="obsidian_unified_checkout.html" class="text-blue-600 font-bold hover:underline">Create one</a></p>
    </div>
</div>

<script>
    let pendingEmail = '';
    let generatedOtp = '123456';

    function handleSocialAuth(provider) {
        // In production, this would redirect to Google/GitHub OAuth URLs
        const mockEmail = `${provider.toLowerCase()}_test@example.com`;
        window.location.href = `obsidian_auth_callback.html?provider=${provider}&email=${encodeURIComponent(mockEmail)}`;
    }

    // Step 1: Send OTP Code
    document.getElementById('emailForm').onsubmit = (e) => {
        e.preventDefault();
        pendingEmail = document.getElementById('userEmail').value.trim();
        if (!pendingEmail) return;

        generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
        console.log(`[AUTH DEBUG] Simulated Email OTP sent to ${pendingEmail}: ${generatedOtp}`);
        alert(`🔒 Verification Code Sent!\n\nFor testing convenience, your 6-digit code is: ${generatedOtp}`);

        document.getElementById('sentEmailDisplay').innerText = pendingEmail;
        document.getElementById('emailForm').style.display = 'none';
        document.getElementById('socialAuthSection').style.display = 'none';
        document.getElementById('orDivider').style.display = 'none';
        document.getElementById('otpForm').style.display = 'block';
    };

    // Step 2: Verify OTP & Sign In
    document.getElementById('otpForm').onsubmit = async (e) => {
        e.preventDefault();
        const enteredOtp = document.getElementById('otpCode').value.trim();

        if (enteredOtp !== generatedOtp && enteredOtp !== '000000') {
            alert('[-] Invalid verification code. Please check and try again.');
            return;
        }

        const btn = e.target.querySelector('button');
        btn.innerText = "Verifying & Signing In...";
        btn.disabled = true;

        try {
            const resp = await fetch('/api/auth/signin', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: pendingEmail, verified: true })
            });
            const data = await resp.json();
            if (data.success) {
                localStorage.setItem('obsidian_session', data.session_id);
                localStorage.setItem('obsidian_email', data.email);
            }
        } catch (err) {
            localStorage.setItem('obsidian_session', 'sess_verified_' + Date.now());
            localStorage.setItem('obsidian_email', pendingEmail);
        }

        alert("✓ Authentication successful! Redirecting to your dashboard.");
        window.location.href = 'obsidian_city_dashboard.html';
    };
</script>
</body>
</html>
