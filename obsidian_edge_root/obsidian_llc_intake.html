        body { background-color: #f8fafc; color: #0f172a; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }

<body>

    <div class="form-card">
        <div class="mb-6">
            <a href="obsidian_llc_formation.html" class="text-xs font-bold text-blue-600 hover:underline">← Back</a>
        </div>

        <div class="mb-10">
            <h1 class="text-3xl font-black text-slate-900 tracking-tight">Business Details</h1>
            <p class="text-sm text-slate-500 mt-2">Enter the legal details for your new LLC formation.</p>
        </div>

        <form id="llcForm">
            <div class="input-group">
                <label for="businessName">Proposed Business Name</label>
                <div class="flex gap-2">
                    <input type="text" id="businessName" class="flex-1" placeholder="My Empire LLC" required>
                    <button type="button" onclick="checkNameAvailability()" class="bg-slate-900 text-white px-4 rounded-xl text-[10px] font-black uppercase whitespace-nowrap hover:bg-blue-600 transition">Check Databases</button>
                </div>
                <div id="checkStatus" class="mt-2 hidden">
                    <div class="flex items-center gap-2 p-3 rounded-xl border" id="statusBox">
                        <span id="statusIcon"></span>
                        <span id="statusText" class="text-[10px] font-bold uppercase"></span>
                    </div>
                </div>
            </div>

            <div class="grid-cols-2 gap-4">
                <div class="input-group">
                    <label>Formation State</label>
                    <select id="formationState" required>
                        <option value="">Select State...</option>
                        <!-- Injected via JS -->
                    </select>
                </div>
                <div class="input-group">
                    <label>Business Type</label>
                    <select id="businessType" required>
                        <option value="LLC">Limited Liability Company</option>
                        <option value="CORP">Corporation</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>Primary Business Purpose</label>
                <textarea id="businessPurpose" placeholder="e.g. Software development and digital assets..." rows="3" required></textarea>
            </div>

            <div class="bg-blue-50 border-blue-100 p-6 rounded-2xl mb-8">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-blue-700">Registered Agent Service</span>
                    <span class="text-xs font-black text-blue-700">$125/year</span>
                </div>
                <p class="text-[10px] text-blue-600 leading-relaxed">Highly Recommended: Keeps your personal address off public records. Included in checkout total.</p>
            </div>

            <button type="submit" class="btn-next">Continue to Secure Checkout →</button>
        </form>
    </div>

    <script>
        async function checkNameAvailability() {
            const name = document.getElementById('businessName').value.trim();
            if (!name) return alert("Please enter a business name to check.");

            const statusDiv = document.getElementById('checkStatus');
            const statusBox = document.getElementById('statusBox');
            const statusIcon = document.getElementById('statusIcon');
            const statusText = document.getElementById('statusText');

            statusDiv.classList.remove('hidden');
            statusBox.className = "flex items-center gap-2 p-3 rounded-xl border bg-slate-50 border-slate-200 animate-pulse";
            statusIcon.innerText = "⏳";
            statusText.innerText = "Cross-referencing Copyright & USPTO Databases...";

            // Simulation of database cross-referencing
            setTimeout(() => {
                const isConflict = name.toLowerCase().includes("apple") || name.toLowerCase().includes("google") || name.toLowerCase().includes("microsoft");

                statusBox.classList.remove('animate-pulse');
                if (isConflict) {
                    statusBox.className = "flex items-center gap-2 p-3 rounded-xl border bg-red-50 border-red-200 text-red-700";
                    statusIcon.innerText = "⚠️";
                    statusText.innerText = "Conflict Detected: Potential Trademark Infringement Found.";
                } else {
                    statusBox.className = "flex items-center gap-2 p-3 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-700";
                    statusIcon.innerText = "✅";
                    statusText.innerText = "Clearance Confirmed: No active conflicts in Global Registries.";
                }
            }, 2500);
        }

        async function loadStates() {
            const select = document.getElementById('formationState');
            const preselected = localStorage.getItem('preselected_state');

            try {
                const resp = await fetch('/api/llc/states');
                const data = await resp.json();
                if (data.success) {
                    Object.entries(data.states).forEach(([code, info]) => {
                        const opt = document.createElement('option');
                        opt.value = code;
                        opt.innerText = info.name;
                        if (code === preselected) opt.selected = true;
                        select.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error("Failed to load states:", err);
            }
        }

        window.addEventListener('DOMContentLoaded', loadStates);

        document.getElementById('llcForm').onsubmit = async (e) => {
            e.preventDefault();
            const stateCode = document.getElementById('formationState').value;

            // Fetch live state fee for total calculation
            const feeResp = await fetch(`/api/llc/state-info?state=${stateCode}`);
            const feeData = await feeResp.json();
            const stateFee = feeData.success ? feeData.state.fee : 50.00;

            const data = {
                business_name: document.getElementById('businessName').value,
                state: stateCode,
                state_fee: stateFee,
                type: document.getElementById('businessType').value,
                purpose: document.getElementById('businessPurpose').value
            };

            // Save to temporary storage for checkout session
            localStorage.setItem('pending_llc_data', JSON.stringify(data));

            // Redirect to unified checkout with LLC pricing bundle
            // Bundle: $39 (Service) + $125 (Agent) + State Fee
            const totalService = 39.00 + 125.00;
            window.location.href = `obsidian_unified_checkout.html?type=llc_formation&price=${totalService}&state_fee=${stateFee}&bundle=true`;
        };
    </script>
    <script src="assets/obsidian_performance_engine.js"></script>
</body>
