        .label { color: #718096; text-transform: uppercase; font-size: 0.8em; letter-spacing: 2px; margin-bottom: 10px; }

        .node-list { margin-top: 20px; }
        .node-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #2d3748; }
        .status-gathering { color: #48bb78; font-weight: bold; }
    </style>
<link href="/assets/hyper_frame.css" rel="stylesheet"/><script src="/assets/hyper_frame.js"></script></head>
