    <div class="text-center">
        <div class="spinner mx-auto mb-6"></div>
        <h1 class="text-xl font-black tracking-tight">Securing Session...</h1>
        <p class="text-slate-500 text-xs mt-2">Verifying credentials with Obsidian Auth Server.</p>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const provider = params.get('provider') || 'social';
            const email = params.get('email') || `user_${Date.now()}@obsidian.city`;

            try {
                const resp = await fetch('/api/auth/signin', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: email, provider: provider })
                });
                const data = await resp.json();
                if (data.success) {
                    localStorage.setItem('obsidian_session', JSON.stringify({
                        session_id: data.session_id,
                        email: data.email
                    }));
                }
            } catch(e) {
                // Fallback for offline/local testing
                localStorage.setItem('obsidian_session', JSON.stringify({
                    session_id: 'sess_callback_' + Date.now(),
                    email: email
                }));
            }

            setTimeout(() => {
                window.location.href = 'obsidian_city_dashboard.html';
            }, 1000);
        });
    </script>
    <script src="assets/obsidian_performance_engine.js"></script>
