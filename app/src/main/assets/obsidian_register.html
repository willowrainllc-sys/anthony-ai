<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Create Account | Obsidian City</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; color: #0f172a; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .auth-card { background: #ffffff; border: 1px solid #e2e8f0; padding: 45px; border-radius: 28px; width: 100%; max-width: 440px; box-shadow: 0 20px 50px rgba(0,0,0,0.06); }
        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 11px; color: #475569; margin-bottom: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; background: #f8fafc; border: 1px solid #cbd5e1; padding: 12px 16px; border-radius: 12px; color: #0f172a; outline: none; transition: 0.2s; font-size: 14px; }
        input:focus { border-color: #2563eb; background: #ffffff; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn-primary { width: 100%; background: #2563eb; color: #fff; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 14px; transition: 0.2s; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(37,99,235,0.25); }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="mb-4">
        <a href="/index.html" class="text-xs font-bold text-blue-600 hover:underline">← Return to Storefront</a>
    </div>

    <div class="text-center mb-8">
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">Create your account</h1>
        <p class="text-xs text-slate-500 mt-1">Start building your digital empire today.</p>
    </div>

    <form id="registerForm">
        <div class="input-group">
            <label for="regName">Full Name</label>
            <input type="text" id="regName" placeholder="Jane Doe" required>
        </div>
        <div class="input-group">
            <label for="regEmail">Email Address</label>
            <input type="email" id="regEmail" placeholder="you@example.com" required>
        </div>
        <div class="input-group">
            <label for="regPass">Choose Password</label>
            <input type="password" id="regPass" placeholder="••••••••••••" required>
        </div>

        <button type="submit" class="btn-primary mt-2">Create Account & Continue</button>
    </form>

    <div class="mt-8 text-center text-xs text-slate-500">
        <p>Already have an account? <a href="/signin" class="text-blue-600 font-bold hover:underline">Sign in</a></p>
    </div>
</div>

<script>
    document.getElementById('registerForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.innerText = "Creating Account...";
        btn.disabled = true;

        const email = document.getElementById('regEmail').value;

        try {
            const resp = await fetch('/api/auth/signin', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: email, action: 'register' })
            });
            const data = await resp.json();
            if (data.success) {
                localStorage.setItem('obsidian_session', data.session_id);
                localStorage.setItem('obsidian_email', data.email);
            }
        } catch (err) {
            localStorage.setItem('obsidian_session', 'sess_reg_' + Date.now());
            localStorage.setItem('obsidian_email', email);
        }

        alert("✓ Account created successfully!");
        window.location.href = '/dashboard';
    };
</script>
</body>
</html>
