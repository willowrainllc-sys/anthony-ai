<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LLC Intake | Business Details | Obsidian City</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; color: #0f172a; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .form-card { background: #ffffff; border: 1px solid #e2e8f0; padding: 45px; border-radius: 28px; width: 100%; max-width: 600px; box-shadow: 0 20px 50px rgba(0,0,0,0.06); }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; color: #475569; margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select, textarea { width: 100%; background: #f8fafc; border: 1px solid #cbd5e1; padding: 14px; border-radius: 12px; color: #0f172a; outline: none; transition: 0.2s; font-size: 14px; }
        input:focus { border-color: #2563eb; background: #ffffff; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn-next { width: 100%; background: #2563eb; color: #fff; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 15px; transition: 0.2s; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(37,99,235,0.25); }
        .btn-next:hover { background: #1d4ed8; }
    </style>
    <link href="assets/obsidian_mobile_core.css" rel="stylesheet"/>
    <link href="assets/obsidian_aura_ui.css" rel="stylesheet"/>
</head>
<body>
    <div class="form-card">
        <div class="mb-6">
            <a href="obsidian_llc_formation.html" class="text-xs font-bold text-blue-600 hover:underline">← Back</a>
        </div>

        <div class="mb-10">
            <h1 class="text-3xl font-black text-slate-900 tracking-tight">Business Details</h1>
            <p class="text-sm text-slate-500 mt-2">Enter the legal details for your new LLC formation.</p>
        </div>

        <form id="llcForm">
            <div class="input-group">
                <label>Proposed Business Name</label>
                <input type="text" id="businessName" placeholder="My Empire LLC" required>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="input-group">
                    <label>Formation State</label>
                    <select id="formationState" required>
                        <option value="AR">Arkansas</option>
                        <option value="WY">Wyoming (Tax Haven)</option>
                        <option value="DE">Delaware</option>
                        <option value="TX">Texas</option>
                        <option value="FL">Florida</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Business Type</label>
                    <select id="businessType" required>
                        <option value="LLC">Limited Liability Company</option>
                        <option value="CORP">Corporation</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>Primary Business Purpose</label>
                <textarea id="businessPurpose" placeholder="e.g. Software development and digital assets..." rows="3" required></textarea>
            </div>

            <div class="bg-blue-50 border border-blue-100 p-6 rounded-2xl mb-8">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-blue-700">Registered Agent Service</span>
                    <span class="text-xs font-black text-blue-700">$125/year</span>
                </div>
                <p class="text-[10px] text-blue-600 leading-relaxed">Highly Recommended: Keeps your personal address off public records. Included in checkout total.</p>
            </div>

            <button type="submit" class="btn-next">Continue to Secure Checkout →</button>
        </form>
    </div>

    <script>
        document.getElementById('llcForm').onsubmit = (e) => {
            e.preventDefault();
            const data = {
                business_name: document.getElementById('businessName').value,
                state: document.getElementById('formationState').value,
                type: document.getElementById('businessType').value,
                purpose: document.getElementById('businessPurpose').value
            };

            // Save to temporary storage for checkout session
            localStorage.setItem('pending_llc_data', JSON.stringify(data));

            // Redirect to unified checkout with LLC pricing
            window.location.href = `obsidian_unified_checkout.html?type=llc_formation&price=39.00&bundle=true`;
        };
    </script>
    <script src="assets/obsidian_aura_engine.js"></script>
</body>
</html>
