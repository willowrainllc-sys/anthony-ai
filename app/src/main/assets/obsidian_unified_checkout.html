<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Secure Checkout | Obsidian City Global</title>
    <meta name="description" content="Obsidian City is the premier wholesale domain registrar and cloud edge provider. Get .com domains at cost, $39 LLC formation, and AI-powered app building."/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; color: #0f172a; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .checkout-box { background: #ffffff; border: 1px solid #e2e8f0; padding: 40px; border-radius: 24px; width: 100%; max-width: 480px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        .input-group { margin-bottom: 18px; }
        label { display: block; font-size: 12px; color: #475569; margin-bottom: 6px; font-weight: 600; }
        input { width: 100%; background: #f8fafc; border: 1px solid #cbd5e1; padding: 12px 16px; border-radius: 10px; color: #0f172a; outline: none; transition: 0.2s; font-size: 14px; }
        input:focus { border-color: #2563eb; background: #ffffff; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .summary-card { background: #f1f5f9; border: 1px solid #e2e8f0; padding: 18px; border-radius: 14px; margin-bottom: 24px; }
        .btn-pay { width: 100%; background: #2563eb; color: #fff; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 15px; transition: 0.2s; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(37,99,235,0.3); }
        .btn-pay:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="checkout-box">
    <div class="mb-4 text-left">
        <a href="index.html" class="text-xs font-bold text-blue-600 hover:underline">← Back</a>
    </div>
    <div class="flex justify-between items-center mb-6 text-left">
        <div>
            <h1 class="text-xl font-black text-slate-900 tracking-tight">Obsidian City</h1>
            <p class="text-xs text-slate-500 font-bold uppercase tracking-widest">Express Guest Checkout</p>
        </div>
        <div class="text-right">
            <span class="text-lg font-black text-slate-900" id="servicePrice">$0.00</span>
            <p class="text-[11px] text-slate-400 font-bold uppercase" id="serviceName">Digital Asset</p>
        </div>
    </div>

    <form id="checkoutForm">
        <div class="input-group text-left">
            <label>Full Name</label>
            <input type="text" id="custName" placeholder="Jane Doe" required>
        </div>
        <div class="input-group text-left">
            <label>Delivery Email (For Domain Info)</label>
            <input type="email" id="custEmail" placeholder="jane@example.com" required>
        </div>

        <!-- 🔱 Payment Fields (Hidden for Free Plans) -->
        <div id="paymentFields">
            <div class="input-group text-left">
                <label>Card Information</label>
                <input type="text" id="cardNum" placeholder="4242 •••• •••• 4242">
            </div>
            <div class="grid grid-cols-2 gap-4 input-group text-left">
                <div>
                    <label>Expiration</label>
                    <input type="text" id="cardExp" placeholder="MM / YY">
                </div>
                <div>
                    <label>CVC</label>
                    <input type="text" id="cardCvc" placeholder="123">
                </div>
            </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-pay mt-2">Authorize & Purchase →</button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-400 font-medium">
        <p id="securityNote">🔒 256-Bit SSL Secured Transaction • No Login Required</p>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type') || 'domain_registration';
    const priceStr = urlParams.get('price') || '14.70';
    const price = parseFloat(priceStr);

    document.getElementById('serviceName').innerText = type.toUpperCase().replace('DOMAIN_', '').replace('_', ' ');
    document.getElementById('servicePrice').innerText = '$' + price.toFixed(2);

    // 🔱 Logic for Free vs Paid UI
    const paymentDiv = document.getElementById('paymentFields');
    const submitBtn = document.getElementById('submitBtn');
    const securityNote = document.getElementById('securityNote');
    const cardInputs = [document.getElementById('cardNum'), document.getElementById('cardExp'), document.getElementById('cardCvc')];

    if (price === 0) {
        paymentDiv.style.display = 'none';
        submitBtn.innerText = 'Claim Free Credits →';
        securityNote.innerText = '✓ Direct Provisioning • No Payment Required';
        cardInputs.forEach(input => input.removeAttribute('required'));
    } else {
        cardInputs.forEach(input => input.setAttribute('required', ''));
    }

    document.getElementById('checkoutForm').onsubmit = async (e) => {
        e.preventDefault();
        submitBtn.innerText = price === 0 ? "Provisioning..." : "Securing Domain...";
        submitBtn.disabled = true;

        const data = {
            name: document.getElementById('custName').value,
            email: document.getElementById('custEmail').value,
            type: type,
            amount: price,
            session_id: localStorage.getItem('obsidian_session')
        };

        try {
            // Send to ARES Backend for Stealth Provisioning
            await fetch('/api/settle/authorize', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            // Redirect to Success with the details for provisioning
            window.location.href = `success.html?type=${encodeURIComponent(type)}&price=${price}`;
        } catch (err) {
            window.location.href = `success.html?type=${encodeURIComponent(type)}&price=${price}`;
        }
    };
</script>
</body>
</html>
