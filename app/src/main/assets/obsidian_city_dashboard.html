<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Account Dashboard | Obsidian City Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; color: #0f172a; font-family: 'Inter', sans-serif; margin: 0; }
        .nav-header { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 18px 60px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .dashboard-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); }
        .status-pill { padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .status-processing { background: #eff6ff; color: #2563eb; }
        .status-approved { background: #ecfdf5; color: #059669; }
    </style>
    <link href="assets/obsidian_mobile_core.css" rel="stylesheet"/>
    <link href="assets/obsidian_aura_ui.css" rel="stylesheet"/>
</head>
<body>
    <nav class="nav-header">
        <a href="index.html" class="font-black text-2xl tracking-tighter text-slate-900">OBSIDIAN<span class="text-blue-600">.CITY</span></a>
        <div class="flex items-center gap-6">
            <span id="userEmail" class="text-xs font-bold text-slate-500">...</span>
            <button onclick="logout()" class="bg-slate-100 text-slate-700 px-4 py-2 rounded-xl font-bold text-xs">Log Out</button>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-6 py-12">
        <div class="mb-12">
            <h1 class="text-4xl font-black text-slate-900 tracking-tight">Welcome Back</h1>
            <p class="text-slate-500 text-sm mt-1">Manage your business entities and digital assets.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12">
            <div class="dashboard-card">
                <h3 class="text-xs text-slate-400 uppercase font-black mb-4">Account Balance</h3>
                <div class="text-3xl font-black text-slate-900">$0.00</div>
            </div>
            <div class="dashboard-card">
                <h3 class="text-xs text-slate-400 uppercase font-black mb-4">Active Domains</h3>
                <div id="domainCount" class="text-3xl font-black text-slate-900">0</div>
            </div>
            <div class="dashboard-card">
                <h3 class="text-xs text-slate-400 uppercase font-black mb-4">Pending Filings</h3>
                <div id="filingCount" class="text-3xl font-black text-slate-900">0</div>
            </div>
        </div>

        <div class="dashboard-card mb-12">
            <h2 class="text-xl font-black text-slate-900 mb-6">Recent Orders & Activity</h2>
            <div id="ordersList" class="space-y-4">
                <div class="text-center py-10 text-slate-400 text-sm italic">Loading your empire data...</div>
            </div>
        </div>
    </div>

    <script>
        const session = JSON.parse(localStorage.getItem('obsidian_session') || '{}');
        if (!session.email) window.location.href = 'obsidian_signin.html';
        document.getElementById('userEmail').innerText = session.email;

        async function loadOrders() {
            try {
                const resp = await fetch(`/api/orders/status?email=${session.email}`);
                const data = await resp.json();
                const list = document.getElementById('ordersList');

                if (data.orders && data.orders.length > 0) {
                    list.innerHTML = '';
                    let filingCount = 0;
                    let domainCount = 0;

                    data.orders.forEach(order => {
                        if (order.type === 'llc_formation') filingCount++;
                        if (order.type.startsWith('domain')) domainCount++;

                        const itemHtml = `
                            <div class="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                <div>
                                    <div class="font-bold text-slate-900">${order.type.toUpperCase().replace('_', ' ')}</div>
                                    <div class="text-[10px] text-slate-400 font-mono">${order.id}</div>
                                </div>
                                <div class="flex items-center gap-6">
                                    <div class="text-right">
                                        <div class="text-sm font-black text-slate-900">$${order.amount.toFixed(2)}</div>
                                        <div class="text-[9px] text-slate-400 uppercase font-bold">${new Date(order.timestamp * 1000).toLocaleDateString()}</div>
                                    </div>
                                    <span class="status-pill status-processing">${order.status}</span>
                                </div>
                            </div>
                        `;
                        list.innerHTML += itemHtml;
                    });

                    document.getElementById('filingCount').innerText = filingCount;
                    document.getElementById('domainCount').innerText = domainCount;
                } else {
                    list.innerHTML = '<div class="text-center py-10 text-slate-400 text-sm">No active orders found. Start building below!</div>';
                }
            } catch (err) {
                console.error(err);
            }
        }

        function logout() {
            localStorage.removeItem('obsidian_session');
            window.location.href = 'index.html';
        }

        window.addEventListener('DOMContentLoaded', loadOrders);
    </script>
    <script src="assets/obsidian_aura_engine.js"></script>
</body>
</html>
