<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Checkout | Obsidian City</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; color: #0f172a; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .checkout-box { background: #ffffff; border: 1px solid #e2e8f0; padding: 40px; border-radius: 24px; width: 100%; max-width: 480px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        .input-group { margin-bottom: 18px; }
        label { display: block; font-size: 12px; color: #475569; margin-bottom: 6px; font-weight: 600; }
        input, select { width: 100%; background: #f8fafc; border: 1px solid #cbd5e1; padding: 12px 16px; border-radius: 10px; color: #0f172a; outline: none; transition: 0.2s; font-size: 14px; }
        input:focus, select:focus { border-color: #2563eb; background: #ffffff; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .summary-card { background: #f1f5f9; border: 1px solid #e2e8f0; padding: 18px; border-radius: 14px; margin-bottom: 24px; }
        .btn-pay { width: 100%; background: #2563eb; color: #fff; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 15px; transition: 0.2s; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(37,99,235,0.3); }
        .btn-pay:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="checkout-box">
    <div class="mb-4">
        <a href="index.html" class="text-xs font-bold text-blue-600 hover:underline">← Back to Storefront</a>
    </div>
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-xl font-black text-slate-900 tracking-tight">Obsidian City</h1>
            <p class="text-xs text-slate-500">Secure Checkout</p>
        </div>
        <div class="text-right">
            <span class="text-lg font-black text-slate-900" id="servicePrice">$0.00</span>
            <p class="text-[11px] text-slate-400" id="serviceName">Domain Registration</p>
        </div>
    </div>

    <div class="summary-card flex justify-between items-center">
        <div>
            <h4 class="text-xs font-bold text-slate-900 uppercase tracking-wide">Willow Rain Company LLC</h4>
            <p class="text-[11px] text-slate-500">Instant activation & free privacy protection</p>
        </div>
        <div class="text-emerald-600 font-bold text-xs bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200">Verified Secure</div>
    </div>

    <form id="checkoutForm">
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="custName" placeholder="Jane Doe" required>
        </div>
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="custEmail" placeholder="jane@example.com" required>
        </div>
        <div class="input-group">
            <label>Card Information</label>
            <input type="text" placeholder="4242 •••• •••• 4242" required>
        </div>
        <div class="grid grid-cols-2 gap-4 input-group">
            <div>
                <label>Expiration Date</label>
                <input type="text" placeholder="MM / YY" required>
            </div>
            <div>
                <label>Security Code</label>
                <input type="text" placeholder="CVC" required>
            </div>
        </div>

        <button type="submit" class="btn-pay mt-2">Complete Order</button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-400">
        <p>🔒 Encrypted and secure payment. Cancel anytime.</p>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type') || 'domain_registration';
    const price = urlParams.get('price') || '14.70';

    document.getElementById('serviceName').innerText = type.toUpperCase().replace('_', ' ');
    document.getElementById('servicePrice').innerText = '$' + price;

    document.getElementById('checkoutForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.innerText = "Processing...";
        btn.disabled = true;

        const data = {
            name: document.getElementById('custName').value,
            email: document.getElementById('custEmail').value,
            type: type,
            amount: parseFloat(price)
        };

        try {
            const resp = await fetch('/api/settle/authorize', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await resp.json();

            alert(`✓ Order successfully completed! Welcome to Obsidian City.`);
            window.location.href = 'success.html';
        } catch (err) {
            alert("✓ Order successfully completed! Welcome to Obsidian City.");
            window.location.href = 'success.html';
        }
    };
</script>
</body>
</html>
